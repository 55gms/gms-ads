# Local development stack: the app plus Postgres, with named volumes for the
# database and uploaded media.
#
#   cp .env.example .env   # then fill in SESSION_SECRET and the AUTHOMETRY_* values
#   docker compose up --build
#
# The app runs migrations on start and listens on http://localhost:3000.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gms_ads
      POSTGRES_PASSWORD: gms_ads
      POSTGRES_DB: gms_ads
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gms_ads -d gms_ads"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://gms_ads:gms_ads@db:5432/gms_ads
      PGSSLMODE: disable
      MEDIA_DIR: /data/media
      # Local http: Chrome and Firefox accept Secure cookies on localhost; Safari needs false.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - media:/data/media
    ports:
      - "3000:3000"

volumes:
  pgdata:
  media:
